[pytest]
# Only the automated suite. Root-level test_*.py files and Scripts/Testing/
# are manual scripts that run on import, so they must not be collected.
testpaths = tests
# tests/manual holds hand-run scripts (they execute on import)
norecursedirs = manual
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
